name: Gemini scale checks
on:
  push:
    branches: [design/glassmorphic-v2]
    paths:
      - 'scanner_gemini_scale.js'
      - 'scanner_local.js'
      - 'index.html'
      - 'tests/gemini-scale.test.cjs'
      - '.github/workflows/gemini-scale-check.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check scanner_gemini_scale.js
          node --check scanner_local.js
          node --check tests/gemini-scale.test.cjs
      - name: Test five-attempt camera flow (mock Gemini; no API credit)
        run: node tests/gemini-scale.test.cjs
